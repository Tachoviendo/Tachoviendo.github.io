<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Vocacional - UCU Campus Salto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <img src="ucuBlanco.png" alt="UCU Logo" class="logo-small">

        <section class="screen" id="introScreen">
            <h1>¿Qué carrera de UCU Campus Salto es para vos?</h1>
            <p class="subtitle">Respondé 12 preguntas rápidas y descubrí qué carrera va con tu perfil.</p>
            <button class="btn-primary" id="startBtn">Empezar el test</button>
        </section>

        <section class="screen hidden" id="quizScreen">
            <div class="progress-wrap">
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                <p class="progress-text" id="progressText">Pregunta 1 de 12</p>
            </div>
            <h2 class="question-text" id="questionText"></h2>
            <div class="options" id="optionsContainer"></div>
        </section>

        <section class="screen hidden" id="resultScreen">
            <p class="result-eyebrow" id="resultArea"></p>
            <h1 class="result-title" id="resultCareer"></h1>
            <p class="result-desc" id="resultDesc"></p>
            <div class="result-cta">
                <p>🎉 ¡Buscá a alguien del equipo de <strong>UCU Campus Salto</strong> y te entregamos tu cartelito con esta carrera y nuestros contactos!</p>
            </div>
            <button class="btn-secondary" id="restartBtn">Volver a hacer el test</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
